name: update-demand-log
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes, UTC
  workflow_dispatch:             # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: upd
        run: python run_update.py
        continue-on-error: true   # still publish the 'source problem' notice if the update fails
      - name: Commit new data
        if: always()
        run: |
          git config user.name "demand-bot"
          git config user.email "demand-bot@users.noreply.github.com"
          git add docs/demand_log.js docs/forecast.js docs/forecast_archive.js
          git add data 2>/dev/null || true
          git add docs/adequacy_outline.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update demand log" && git pull --rebase && git push)
      - name: Report failure
        if: steps.upd.outcome == 'failure'
        run: exit 1
