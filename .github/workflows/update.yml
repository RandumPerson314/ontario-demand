name: update-demand-log
on:
  schedule:
    - cron: "7,37 * * * *"      # twice an hour, UTC
  workflow_dispatch:             # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Commit new data
        run: |
          git config user.name "demand-bot"
          git config user.email "demand-bot@users.noreply.github.com"
          git add docs/demand_log.js docs/demand_log.json docs/forecast.js docs/forecast_archive.js
          git diff --cached --quiet || (git commit -m "update demand log" && git pull --rebase && git push)
